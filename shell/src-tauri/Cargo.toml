[package]
name = "companion-shell"
version = "0.1.0"
edition = "2021"
description = "Desktop AI companion shell: menu-bar icon, one-input canvas, executor sidecar"
publish = false

[lib]
name = "companion_shell"
path = "src/lib.rs"

[[bin]]
name = "companion-shell"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
serde_json = "1"
rusqlite = { version = "0.43.0", features = ["bundled-sqlcipher-vendored-openssl"] }
security-framework = "3.7.0"
sha2 = "0.11.1"
core-foundation = "0.10.1"
ureq = "3"
url = "2"
libc = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
pdf-extract = "0.12.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
tiny_http = "0.12.0"
