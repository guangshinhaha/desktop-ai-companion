<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Companion</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <div id="log" role="log" aria-live="polite" aria-label="Conversation"></div>
  <p id="status" role="status"></p>
  <div class="row">
    <input id="ask" type="text" autofocus autocomplete="off" spellcheck="false"
           placeholder="Ask, or drop a document to summarise" aria-label="Ask the companion">
    <select id="classification" aria-label="Classification of this chat">
      <option value="" selected>Classification</option>
      <option value="official-open">Official (Open)</option>
      <option value="official-closed">Official (Closed)</option>
      <option value="restricted">Restricted</option>
      <option value="confidential">Confidential</option>
      <option value="secret">Secret</option>
    </select>
  </div>
</main>
<script src="chat.js"></script>
<script src="canvas.js"></script>
</body>
</html>
